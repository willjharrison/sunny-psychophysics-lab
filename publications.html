  <main class="py-12 sm:py-16 max-w-5xl mx-auto px-6 w-full">

    <p class="text-slate-600 text-sm mb-8">Selected papers and preprints from the lab, updated live from Zotero.</p>

    <div id="pubs-feed" class="space-y-4">
      <div class="p-4 rounded-xl border border-slate-200 bg-white text-slate-500 text-sm animate-pulse shadow-sm">

  <script>
    const ZOTERO_GROUP_ID = '6706936';
    const PUBS_COLLECTION_KEY = ''; 

    const API_URL = (PUBS_COLLECTION_KEY && PUBS_COLLECTION_KEY.trim() !== '')
      ? `https://api.zotero.org/groups/${ZOTERO_GROUP_ID}/collections/${PUBS_COLLECTION_KEY}/items?v=3&format=json&sort=date&direction=desc`
      : `https://api.zotero.org/groups/${ZOTERO_GROUP_ID}/items?v=3&format=json&sort=date&direction=desc`;

    async function loadPublications() {
      const container = document.getElementById('pubs-feed');
      try {
        const response = await fetch(API_URL);
        if (response.status === 403) {
          container.innerHTML = `<div class="p-4 rounded-lg border border-amber-300 bg-amber-50 text-amber-800 text-sm">Library Access Restricted: Set 'Library Reading' to 'Anyone on the internet' in Zotero group settings.</div>`;
          return;
        }
        if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
        
        const items = await response.json();
        const pubItems = items.filter(item => item.data && item.data.itemType !== 'attachment' && item.data.itemType !== 'note');

        if (pubItems.length === 0) {
          container.innerHTML = `<p class="text-slate-500 text-sm">No publications found in this collection yet.</p>`;
          return;
        }

        container.innerHTML = '';
        pubItems.forEach(item => {
          const data = item.data;
          const title = data.title || 'Untitled';
          
          let year = '';
          if (data.date) {
            const match = data.date.match(/\d{4}/);
            if (match) year = match[0];
          }

          let authors = '';
          if (data.creators && Array.isArray(data.creators)) {
            authors = data.creators
              .map(c => c.name || `${c.firstName || ''} ${c.lastName || ''}`.trim())
              .filter(Boolean)
              .join(', ');
          }

          const journal = data.publicationTitle

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publications | Sunny Psychophysics Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-amber-500 selection:text-slate-950 min-h-screen flex flex-col justify-between">

  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-500 to-amber-200 flex items-center justify-center font-bold text-slate-950 text-sm">ψ</div>
        <span class="font-bold text-lg tracking-tight text-slate-100">Sunny Psychophysics</span>
      </a>
      <nav class="flex space-x-6 text-sm font-medium text-slate-400">
        <a href="index.html" class="hover:text-amber-400 transition-colors">About & People</a>
        <a href="publications.html" class="text-amber-400 font-semibold">Publications</a>
        <a href="journal-club.html" class="hover:text-amber-400 transition-colors">Journal Club</a>
      </nav>
    </div>
  </header>

  <main class="py-16 max-w-5xl mx-auto px-6 w-full">
    <h1 class="text-3xl font-bold tracking-tight text-white mb-2">Publications</h1>
    <p class="text-slate-400 text-sm mb-8">Selected papers and preprints from the lab, updated live from Zotero.</p>

    <div id="pubs-feed" class="space-y-4">
      <div class="p-4 rounded-lg border border-slate-800 bg-slate-900/60 text-slate-400 text-sm animate-pulse">
        Loading publications...
      </div>
    </div>
  </main>

  <footer class="py-8 border-t border-slate-800 text-center text-xs text-slate-500">
    © Sunny Psychophysics Lab — University of the Sunshine Coast
  </footer>

 <script>
    const ZOTERO_GROUP_ID = '6706936';
    const PUBS_COLLECTION_KEY = 'YOUR_PUBS_KEY'; // Replace with 8-char key if using subfolder, or leave as ''

    const API_URL = (PUBS_COLLECTION_KEY && PUBS_COLLECTION_KEY !== 'YOUR_PUBS_KEY' && PUBS_COLLECTION_KEY.trim() !== '')
      ? `https://api.zotero.org/groups/${ZOTERO_GROUP_ID}/collections/${PUBS_COLLECTION_KEY}/items?v=3&format=json&sort=date&direction=desc`
      : `https://api.zotero.org/groups/${ZOTERO_GROUP_ID}/items?v=3&format=json&sort=date&direction=desc`;

    async function loadPublications() {
      const container = document.getElementById('pubs-feed');
      try {
        const response = await fetch(API_URL);
        if (response.status === 403) {
          container.innerHTML = `<div class="p-4 rounded border border-amber-800/50 bg-amber-950/20 text-amber-300 text-sm">Library Access Restricted: Set 'Library Reading' to 'Anyone on the internet' in Zotero group settings.</div>`;
          return;
        }
        if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
        
        const items = await response.json();
        const pubItems = items.filter(item => item.data && item.data.itemType !== 'attachment' && item.data.itemType !== 'note');

        if (pubItems.length === 0) {
          container.innerHTML = `<p class="text-slate-400 text-sm">No publications found in this collection yet.</p>`;
          return;
        }

        container.innerHTML = '';
        pubItems.forEach(item => {
          const data = item.data;
          const title = data.title || 'Untitled';
          
          let year = '';
          if (data.date) {
            const match = data.date.match(/\d{4}/);
            if (match) year = match[0];
          }

          let authors = '';
          if (data.creators && Array.isArray(data.creators)) {
            authors = data.creators
              .map(c => c.name || `${c.firstName || ''} ${c.lastName || ''}`.trim())
              .filter(Boolean)
              .join(', ');
          }

          const journal = data.publicationTitle || data.journalAbbreviation || data.publisher || '';
          const link = data.url || (data.DOI ? `https://doi.org/${data.DOI}` : '#');

          const card = document.createElement('div');
          card.className = 'p-5 rounded-lg border border-slate-800 bg-slate-900/80 hover:border-slate-700 transition-colors';
          card.innerHTML = `
            <div class="flex justify-between items-start gap-4">
              <a href="${link}" target="_blank" rel="noopener noreferrer" class="font-semibold text-slate-100 hover:text-amber-400 text-base leading-snug">${title}</a>
              ${year ? `<span class="px-2 py-0.5 rounded bg-slate-800 text-amber-400 text-xs font-mono">${year}</span>` : ''}
            </div>
            ${authors ? `<p class="text-xs text-slate-400 mt-2">${authors}</p>` : ''}
            ${journal ? `<p class="text-xs text-amber-500/80 mt-1 italic">${journal}</p>` : ''}
          `;
          container.appendChild(card);
        });
      } catch (e) {
        console.error(e);
        container.innerHTML = `<p class="text-red-400 text-sm">Error connecting to Zotero (${e.message}).</p>`;
      }
    }
    loadPublications();
  </script>
</body>
</html>
